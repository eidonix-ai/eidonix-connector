# What this machine shares through the Eidonix connector.
site: example-gpu-site                # the connector's name in Eidonix Setup

# The server this connector connects out to.
upstream:
  url: https://connect.eidonix.com
  token: cxn_abcdefghijklmnop_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA   # placeholder; issued in Eidonix Setup
  public-keys: [AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=]   # the upstream's signing keys; during a rotation, old and new

access-log: /var/log/eidonix-connector/access.log   # one line per request; never contents

# What this machine shares, by name. The connector reaches ONLY the addresses
# listed here, and accepts only the requests each service allows.
services:
  gpu1:
    address: 10.0.0.33:8000           # host:port = plain HTTP
    allowed-endpoints: [POST /v1/*, GET /v1/models]
    models: [Qwen/Qwen3-32B]          # only these models may be used
    health: /health
    max-concurrent-requests: 32
    idle-timeout: 15m                 # stop a request that sends nothing for this long
  gpu2:
    address: 10.0.0.34:8000
    allowed-endpoints: [POST /v1/*, GET /v1/models]
    models: [meta-llama/Llama-3.3-70B-Instruct]
    health: /health
    idle-timeout: 15m
  chat-small:                         # small chat model on the utility server
    address: 10.0.0.30:8004
    allowed-endpoints: [POST /v1/*, GET /v1/models]
    models: [qwen-small]
    health: /health
    max-concurrent-requests: 8
  ocr:                                # layout parsing (PDF/scan → text)
    address: 10.0.0.30:8002
    allowed-endpoints: [POST /layout-parsing]
    health: /health
  embed:
    address: 10.0.0.30:8001
    allowed-endpoints: [POST /embeddings]   # this server's API is at / rather than /v1
    models:
      nomic-ai/nomic-embed-text-v1.5: {alias: nomic-embed}   # <name your server uses>: {alias: <name Eidonix uses>}
    health: /health
  rerank-jina:
    address: 10.0.0.30:8006
    allowed-endpoints: [POST /v1/rerank]
    models:
      jina-reranker-v3: {alias: jina-reranker}
    health: /health
  stt:
    address: 10.0.0.30:8007
    allowed-endpoints: [POST /v1/audio/transcriptions]
    models:
      /models/faster-whisper-large-v3-turbo: {alias: whisper}
    health: /health
  tts:
    address: 10.0.0.30:8009
    allowed-endpoints: [POST /v1/audio/speech, GET /v1/audio/voices]
    models: [kokoro]
    health: /health
  image:
    address: 10.0.0.30:8010
    allowed-endpoints: [POST /v1/images/*]
    models: [qwen-image]
    health: /health
    max-concurrent-requests: 1        # one image at a time on this card
  voice-live:                         # live transcription over a WebSocket
    address: 10.0.0.30:8011
    allowed-endpoints: [WEBSOCKET /v1/stream, GET /v1/config]
    health: /health
    max-concurrent-requests: 4
