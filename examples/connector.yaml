# What this machine shares through the Eidonix connector.
site: PASTE_CONNECTOR_NAME_FROM_SETUP   # must match the connector's name in Eidonix Setup

# The server this connector connects out to.
upstream:
  url: https://connect.eidonix.com
  token: PASTE_TOKEN_FROM_SETUP
  public-keys: [PASTE_KEY_FROM_SETUP]   # during a key rotation, list old and new
  # proxy: http://proxy:3128            # only if your network requires a web proxy
  # ca-certificate: |                   # only if your network inspects TLS with its own certificate
  #   -----BEGIN CERTIFICATE-----
  #   …
  #   -----END CERTIFICATE-----

# access-log: /var/log/eidonix-connector/access.log   # default; one line per request, never contents

# The services this machine shares, by name (lowercase letters, digits and -,
# unique in this file). The connector reaches ONLY the addresses listed here,
# and accepts only the requests each service's allowed-endpoints lists.
services:
  # my-chat:
  #   address: 10.0.0.5:8000              # host:port = plain HTTP; https://host:port for TLS
  #   allowed-endpoints:                  # METHOD /path; a final /* matches everything below it
  #     - POST /v1/*                      #   methods: GET, POST, PUT, DELETE, WEBSOCKET
  #     - GET /v1/models
  #   models: [model-name]                # optional: only these models; without it bodies are not inspected
  #   # models:                           # or rename: <name on the server>: {alias: <name applications use>}
  #   #   org/model-name: {alias: model}
  #   health: /health                     # optional: GET every 15 s; without it, reachability only
  #   # api-key: sk-…                     # only if the server needs a key (sent as Authorization: Bearer)
  #   # max-concurrent-requests: 16       # default
  #   # max-requests-per-minute: 600      # default: no limit
  #   # idle-timeout: 5m                  # how long a reply may go quiet; default 5m

  # my-voice:
  #   address: 10.0.0.5:8011
  #   allowed-endpoints: [WEBSOCKET /v1/stream, GET /v1/config]

  # files:                                # your own S3-compatible storage (MinIO, Ceph, RustFS, …)
  #   kind: s3
  #   address: https://s3.example.com:9000
  #   bucket: my-bucket                   # must already exist; the whole bucket belongs to the hub's applications
  #   access-key: …
  #   secret-key: …
  #   # region: us-east-1                 # default
  #   encryption: sse-c                   # none (default) | sse-s3 | sse-c
  #   encryption-key: …                   # sse-c only: base64 of 32 bytes (eidonix-connector generate-key); back it up
  #   # ca-certificate: |                 # only for a store with its own certificate
  #   # read-only: false                  # default
  #   # max-file-size: 5GiB               # default (also the maximum)
  #   # max-concurrent-requests: 16       # default
