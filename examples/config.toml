# Cletus connector configuration. One file, TOML, at /etc/cletus-connector/config.toml.
# Every service the gateway may reach is its own [[routes]] entry; nothing else is reachable.
# Replace the placeholder with the server operator's independently verified Ed25519 key.

server = "https://gateway.example.com"
token_file = "/etc/cletus-connector/token"
audit_log = "/var/log/cletus-connector/audit.jsonl"

[server_keys]
"operator-key-id" = "REPLACE_WITH_VERIFIED_BASE64_ED25519_PUBLIC_KEY"

[tls]
ca = "system"

# Chat completions served by vLLM.
[[routes]]
id = "chat"
type = "openai_chat"
flavor = "vllm"
upstreams = ["http://192.0.2.20:8000"]
balance = "least_inflight"
max_concurrency = 32
max_request_bytes = "16MiB"
max_response_bytes = "256MiB"
idle_timeout = "120s"

# Reranking. The gateway asks for "jina-reranker"; the upstream serves "jina-reranker-v3".
[[routes]]
id = "rerank"
type = "rerank"
upstreams = ["http://192.0.2.20:8006"]
health = { path = "/health" }
extra_paths = [["GET", "/v1/models"]]

[routes.models]   # alias the gateway sends = id the upstream serves
"jina-reranker" = "jina-reranker-v3"

# Speech to text (multipart uploads); the model form field is translated the same way.
[[routes]]
id = "stt"
type = "audio_transcription"
upstreams = ["http://192.0.2.20:8007"]
health = { path = "/health" }

[routes.models]
"whisper" = "/models/faster-whisper-large-v3-turbo"
