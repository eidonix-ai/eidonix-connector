name: eidonix-connector
arch: ${ARCH}
platform: linux
mtime: "1970-01-01T00:00:00Z"
version: ${VERSION}
maintainer: Eidonix
homepage: https://github.com/eidonix-ai/eidonix-connector
license: Apache-2.0
description: Outbound-only connector that shares exactly the services its configuration file names
section: net
priority: optional
depends:
  - ca-certificates
overrides:
  deb:
    depends: [ca-certificates, procps, passwd]
  rpm:
    depends: [ca-certificates, procps-ng, shadow-utils]
  apk:
    depends: [ca-certificates, openrc, logrotate]
# Release builds sign the .apk with the key in APK_SIGNING_KEY; its public half
# is keys/eidonix-connector.rsa.pub (install as /etc/apk/keys/eidonix-connector.rsa.pub).
# Unset, the package is unsigned (CI test packages).
apk:
  signature:
    key_file: ${APK_SIGNING_KEY}
    key_name: eidonix-connector
contents:
  - src: dist/eidonix-connector-linux-${ARCH}
    dst: /usr/bin/eidonix-connector
    file_info: {mode: 0755}
  - src: packaging/eidonix-connector.service
    dst: /usr/lib/systemd/system/eidonix-connector.service
    packager: deb
  - src: packaging/eidonix-connector.service
    dst: /usr/lib/systemd/system/eidonix-connector.service
    packager: rpm
  - src: packaging/eidonix-connector.openrc
    dst: /etc/init.d/eidonix-connector
    file_info: {mode: 0755}
    packager: apk
  # The blank template; the owner fills it in. Never replaced on upgrade.
  - src: examples/connector.yaml
    dst: /etc/eidonix-connector/connector.yaml
    type: config|noreplace
    file_info: {mode: 0640, owner: root, group: eidonix-connector}
  - src: examples/connector.yaml
    dst: /usr/share/doc/eidonix-connector/connector.yaml
  - src: examples/gpu-server.yaml
    dst: /usr/share/doc/eidonix-connector/gpu-server.yaml
  - src: packaging/logrotate
    dst: /etc/logrotate.d/eidonix-connector
    type: config|noreplace
  - src: LICENSE
    dst: /usr/share/doc/eidonix-connector/LICENSE
scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
